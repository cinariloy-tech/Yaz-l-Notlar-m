<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YazılıNotları</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --border: #e2e6ef;
      --accent: #2b6cb0;
      --accent-soft: #e8f0fb;
      --shadow: 0 2px 10px rgba(20, 30, 60, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }
    .names {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .course-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: border-color .15s, transform .15s;
    }
    .course-btn:hover { transform: translateY(-1px); }
    .course-btn .name { font-weight: 700; font-size: 1.05rem; display: block; }
    .course-btn .sub { color: var(--muted); font-size: 0.85rem; }
    .course-btn.active { border-color: var(--accent); background: var(--accent-soft); }

    .viewer {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .viewer-head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .viewer-head .title { font-weight: 700; }
    .viewer-head .meta { color: var(--muted); font-size: 0.88rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--card);
    }
    .btn.primary { background: var(--accent); color: #fff; }
    iframe.pdf {
      width: 100%;
      height: 78vh;
      min-height: 480px;
      border: 0;
      display: block;
      background: #525659;
    }
    .fallback {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 20px;
    }
    @media (max-width: 600px) {
      iframe.pdf { height: 70vh; min-height: 380px; }
      header h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="names">Muhammet Çınar İlarslan ve Erdal Can Kırık</div>

  <header>
    <h1>YazılıNotları</h1>
    <p>9. Sınıf 1. Dönem 1. Yazılı notları. Dersi seçin, notu sitede açın veya indirin.</p>
  </header>

  <main>
    <div class="courses" id="courses"></div>

    <section class="viewer" id="viewer">
      <div class="viewer-head">
        <div>
          <div class="title" id="doc-title"></div>
          <div class="meta" id="doc-meta"></div>
        </div>
        <div class="actions">
          <a class="btn" id="open-link" href="#" target="_blank" rel="noopener">Yeni sekmede aç</a>
          <a class="btn primary" id="download-link" href="#" download>İndir (PDF)</a>
        </div>
      </div>
      <iframe class="pdf" id="pdf-frame" title="Ders notu PDF"></iframe>
      <div class="fallback" id="fallback">
        Telefonunuzda PDF görüntülenmiyorsa "Yeni sekmede aç" veya "İndir" düğmesini kullanın.
      </div>
    </section>
  </main>

  <footer>Ders notları - 1. Dönem 1. Yazılı hazırlık</footer>

  <script>
    // Her ders için 1. dönem 1. yazılı notu.
    // Yeni ders ya da yazılı eklemek için bu listeye bir kayıt eklemeniz yeterli.
    const COURSES = [
      {
        id: "biyoloji",
        name: "Biyoloji",
        sub: "9. Sınıf - Senaryo 2",
        exams: [
          {
            title: "1. Dönem 1. Yazılı",
            meta: "Biyoloji - Senaryo 2 - Çalışma rehberi",
            file: "pdf/biyoloji-1-donem-1-yazili-senaryo2.pdf"
          }
        ]
      },
      {
        id: "kimya",
        name: "Kimya",
        sub: "9. Sınıf - Senaryo 3",
        exams: [
          {
            title: "1. Dönem 1. Yazılı",
            meta: "Kimya - Senaryo 3 - Çalışma rehberi",
            file: "pdf/kimya-1-donem-1-yazili-senaryo3.pdf"
          }
        ]
      },
      {
        id: "tarih",
        name: "Tarih",
        sub: "9. Sınıf - Senaryo 2",
        exams: [
          {
            title: "1. Dönem 1. Yazılı",
            meta: "Tarih - Senaryo 2 - Çalışma rehberi",
            file: "pdf/tarih-1-donem-1-yazili-senaryo2.pdf"
          }
        ]
      },
      {
        id: "turk-dili",
        name: "Türk Dili ve Edebiyatı",
        sub: "9. Sınıf - Senaryo 3",
        exams: [
          {
            title: "1. Dönem 1. Yazılı",
            meta: "Türk Dili ve Edebiyatı - Senaryo 3 - Çalışma rehberi",
            file: "pdf/turk-dili-ve-edebiyat-1-donem-1-yazili-senaryo3.pdf"
          }
        ]
      },
      {
        id: "cografya",
        name: "Coğrafya",
        sub: "9. Sınıf - Senaryo 2",
        exams: [
          {
            title: "1. Dönem 1. Yazılı",
            meta: "Coğrafya - Senaryo 2 - Çalışma rehberi",
            file: "pdf/cografya-1-donem-1-yazili-senaryo2.pdf"
          }
        ]
      }
    ];

    const coursesEl = document.getElementById("courses");
    const frame = document.getElementById("pdf-frame");
    const titleEl = document.getElementById("doc-title");
    const metaEl = document.getElementById("doc-meta");
    const openLink = document.getElementById("open-link");
    const downloadLink = document.getElementById("download-link");

    function showExam(course, exam) {
      titleEl.textContent = course.name + " - " + exam.title;
      metaEl.textContent = exam.meta;
      frame.src = exam.file;
      openLink.href = exam.file;
      downloadLink.href = exam.file;
      downloadLink.setAttribute("download", exam.file.split("/").pop());
    }

    function selectCourse(id) {
      const course = COURSES.find(c => c.id === id) || COURSES[0];
      document.querySelectorAll(".course-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.id === course.id);
      });
      // Dersin ilk yazılısı (1. dönem 1. yazılı) otomatik açılır.
      showExam(course, course.exams[0]);
      history.replaceState(null, "", "#" + course.id);
    }

    COURSES.forEach(course => {
      const btn = document.createElement("button");
      btn.className = "course-btn";
      btn.dataset.id = course.id;
      btn.innerHTML = '<span class="name"></span><span class="sub"></span>';
      btn.querySelector(".name").textContent = course.name;
      btn.querySelector(".sub").textContent = course.sub;
      btn.addEventListener("click", () => selectCourse(course.id));
      coursesEl.appendChild(btn);
    });

    // Her 30 saniyede bir sitenin kendi dosyasına hafif bir istek atar.
    // Sayfa açık olduğu sürece çalışır. Sitenin uykuya geçmemesi için
    // dışarıdan bir uptime servisi (ör. UptimeRobot) da önerilir.
    const KEEP_ALIVE_MS = 30 * 1000;
    function keepAlive() {
      fetch("pdf/biyoloji-1-donem-1-yazili-senaryo2.pdf", {
        method: "HEAD",
        cache: "no-store"
      }).catch(() => {});
    }
    setInterval(keepAlive, KEEP_ALIVE_MS);

    const fromHash = location.hash.replace("#", "");
    selectCourse(fromHash || COURSES[0].id);
  </script>
</body>
</html>
