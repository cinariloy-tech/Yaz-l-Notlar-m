<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YazılıNotları</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --border: #e2e6ef;
      --accent: #2b6cb0;
      --accent-soft: #e8f0fb;
      --shadow: 0 2px 10px rgba(20, 30, 60, 0.07);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    .names {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    header h1 { margin: 0; font-size: 1.35rem; }
    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .steps span.current { color: var(--accent); font-weight: 700; }

    main {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 { font-size: 1.1rem; margin: 4px 0 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .choice {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      box-shadow: var(--shadow);
      transition: border-color .15s, transform .15s;
    }
    .choice:hover { border-color: var(--accent); transform: translateY(-1px); }
    .choice .name { font-weight: 700; font-size: 1.05rem; display: block; }
    .choice .sub { color: var(--muted); font-size: 0.85rem; }

    .back {
      margin-bottom: 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--accent);
      cursor: pointer;
      background: var(--card);
    }

    /* Tam sayfa PDF görünümü */
    .pdf-view {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--card);
      z-index: 10;
    }
    .pdf-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .pdf-bar .title { font-weight: 700; font-size: 0.95rem; }
    .pdf-bar .meta { color: var(--muted); font-size: 0.8rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 8px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--card);
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .pdf-view iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #525659;
    }
    .pdf-fallback {
      padding: 14px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="names">Muhammet Çınar İlarslan ve Erdal Can Kırık</div>

  <header>
    <h1>YazılıNotları</h1>
    <div class="steps" id="steps"></div>
  </header>

  <main id="app"></main>

  <footer>9. Sınıf ders notları</footer>

  <div class="pdf-view" id="pdf-view" hidden>
    <div class="pdf-bar">
      <div>
        <div class="title" id="pdf-title"></div>
        <div class="meta" id="pdf-meta"></div>
      </div>
      <div class="actions">
        <button class="btn" id="pdf-back">Geri</button>
        <a class="btn" id="pdf-open" href="#" target="_blank" rel="noopener">Yeni sekmede aç</a>
        <a class="btn primary" id="pdf-download" href="#" download>İndir</a>
      </div>
    </div>
    <iframe id="pdf-frame" title="Ders notu PDF"></iframe>
    <div class="pdf-fallback">PDF görünmüyorsa "Yeni sekmede aç" veya "İndir" düğmesini kullanın.</div>
  </div>

  <script>
    // ==== VERİ ====
    // Yeni sınav, dönem, ders ya da PDF eklemek için sadece bu listeyi düzenleyin.
    const DATA = [
      {
        name: "1. Yazılı",
        donemler: [
          {
            name: "1. Dönem",
            dersler: [
              { name: "Biyoloji",              sub: "Senaryo 2", file: "pdf/biyoloji-1-donem-1-yazili-senaryo2.pdf" },
              { name: "Coğrafya",              sub: "Senaryo 2", file: "pdf/cografya-1-donem-1-yazili-senaryo2.pdf" },
              { name: "Kimya",                 sub: "Senaryo 3", file: "pdf/kimya-1-donem-1-yazili-senaryo3.pdf" },
              { name: "Tarih",                 sub: "Senaryo 2", file: "pdf/tarih-1-donem-1-yazili-senaryo2.pdf" },
              { name: "Türk Dili ve Edebiyatı", sub: "Senaryo 3", file: "pdf/turk-dili-ve-edebiyat-1-donem-1-yazili-senaryo3.pdf" }
            ]
          }
        ]
      }
    ];

    // ==== DURUM ====
    const state = { sinav: null, donem: null, ders: null };
    const app = document.getElementById("app");
    const stepsEl = document.getElementById("steps");
    const pdfView = document.getElementById("pdf-view");
    const pdfFrame = document.getElementById("pdf-frame");

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function choiceButton(name, sub, onClick) {
      const b = el("button", "choice");
      b.appendChild(el("span", "name", name));
      if (sub) b.appendChild(el("span", "sub", sub));
      b.addEventListener("click", onClick);
      return b;
    }

    function backButton(onClick) {
      const b = el("button", "back", "← Geri");
      b.addEventListener("click", onClick);
      return b;
    }

    function renderSteps() {
      const labels = ["Sınav", "Dönem", "Ders"];
      let current = 0;
      if (state.sinav) current = 1;
      if (state.donem) current = 2;
      stepsEl.innerHTML = "";
      labels.forEach((label, i) => {
        const s = el("span", i === current ? "current" : "", (i + 1) + ". " + label);
        stepsEl.appendChild(s);
        if (i < labels.length - 1) stepsEl.appendChild(el("span", "", "›"));
      });
    }

    function renderSinav() {
      app.innerHTML = "";
      app.appendChild(el("h2", "", "Sınav seçin"));
      const grid = el("div", "grid");
      DATA.forEach(s => {
        grid.appendChild(choiceButton(s.name, null, () => { state.sinav = s; state.donem = null; render(); }));
      });
      app.appendChild(grid);
    }

    function renderDonem() {
      app.innerHTML = "";
      app.appendChild(backButton(() => { state.sinav = null; render(); }));
      app.appendChild(el("h2", "", state.sinav.name + " - dönem seçin"));
      const grid = el("div", "grid");
      state.sinav.donemler.forEach(d => {
        grid.appendChild(choiceButton(d.name, null, () => { state.donem = d; render(); }));
      });
      app.appendChild(grid);
    }

    function renderDers() {
      app.innerHTML = "";
      app.appendChild(backButton(() => { state.donem = null; render(); }));
      app.appendChild(el("h2", "", state.donem.name + " - " + state.sinav.name + " - ders seçin"));
      const grid = el("div", "grid");
      state.donem.dersler.forEach(d => {
        grid.appendChild(choiceButton(d.name, d.sub, () => openPdf(d)));
      });
      app.appendChild(grid);
    }

    function openPdf(ders) {
      state.ders = ders;
      document.getElementById("pdf-title").textContent = ders.name + " - " + state.sinav.name;
      document.getElementById("pdf-meta").textContent = state.donem.name + " - " + ders.sub;
      pdfFrame.src = ders.file;
      document.getElementById("pdf-open").href = ders.file;
      const dl = document.getElementById("pdf-download");
      dl.href = ders.file;
      dl.setAttribute("download", ders.file.split("/").pop());
      pdfView.hidden = false;
      location.hash = "pdf";
    }

    function closePdf() {
      pdfView.hidden = true;
      pdfFrame.src = "about:blank";
      state.ders = null;
      if (location.hash === "#pdf") history.replaceState(null, "", location.pathname);
    }

    document.getElementById("pdf-back").addEventListener("click", closePdf);

    function render() {
      renderSteps();
      if (!state.sinav) return renderSinav();
      if (!state.donem) return renderDonem();
      return renderDers();
    }

    // Tarayıcının geri tuşu PDF ekranını kapatsın
    window.addEventListener("hashchange", () => {
      if (location.hash !== "#pdf" && !pdfView.hidden) closePdf();
    });

    // Sitenin uykuya geçmemesi için her 30 saniyede kendi dosyasına hafif istek
    const KEEP_ALIVE_MS = 30 * 1000;
    setInterval(() => {
      fetch("pdf/biyoloji-1-donem-1-yazili-senaryo2.pdf", { method: "HEAD", cache: "no-store" }).catch(() => {});
    }, KEEP_ALIVE_MS);

    // Başlangıç: sınav seçimi
    if (DATA.length === 1) {
      // Tek sınav varsa yine de seçim ekranı gösterilir (akış tutarlı kalsın)
    }
    render();
  </script>
</body>
</html>
